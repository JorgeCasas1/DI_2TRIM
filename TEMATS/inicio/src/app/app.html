<main class="container mt-4">
  <h1>APP ANGULAR</h1>
  <p>Introduce tus datos para comenzar:</p>

  <input #inputNombre class="form-control mb-2" placeholder="Nombre" type="text" />
  <input #inputApellido class="form-control mb-2" placeholder="Apellido" type="text" />

  <select #selectNota class="form-select mb-3">
    <option value="0">Indica la nota que piensas sacar</option>
    <option value="1">1-3</option>
    <option value="2">4-5</option>
    <option value="3">6-7</option>
    <option value="4">8-9</option>
    <option value="5">10</option>
  </select>

  <button
    class="btn btn-primary w-100 mb-4"
    (click)="procesarRespuesta(inputNombre.value, inputApellido.value, selectNota.value)"
  >
    Procesar respuesta
  </button>

  <div class="row align-items-center">
    <div class="col-3">
      <img [src]="imagen" class="img-fluid rounded" alt="Resultado" />
    </div>

    <div class="col-9">
      <p class="h5">Los resultados son:</p>
      <p class="mb-1"><strong>Nombre:</strong> {{ nombre }}</p>
      <p class="mb-1"><strong>Apellido:</strong> {{ apellido }}</p>
      <p class="mb-1"><strong>Nota:</strong> {{ nota }}</p>
    </div>
  </div>
</main>
