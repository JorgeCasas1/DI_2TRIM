<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title></title>
  </head>
  <body>
    <main class="container mt-4">
      <div class="row">
        <div class="col">
          <h2>Registro de tareas</h2>
          <input
            maxlength="180"
            placeholder="Nombre del empleado"
            type="text"
            class="form-control mt-4"
            id="inputNombre"
          />
          <p><span id="spanCaracteres">0</span>/20</p>
          <input
            min="1"
            max="20"
            placeholder="Número del empleado"
            type="number"
            class="form-control mt-2"
            id="inputNumeroEmpleado"
          />
          <div class="mt-4">
            <select
              class="form-select form-select-lg mb-3"
              aria-label="Large select example"
              id="select-genero"
            >
              <option selected value="Selecciona tú género">
                Selecciona tú género
              </option>
              <option value="1">Masculino</option>
              <option value="2">Femenino</option>
              <option value="3">Ninguno</option>
            </select>
          </div>
          <div class="mt-4">
            <button class="btn btn-primary" id="botonRegistrar">
              Registrar
            </button>
          </div>
          <div class="mt-4">
            <h2>Buscador Empleados</h2>
            <input
              placeholder="Introduce el nombre del empleado"
              type="text"
              class="form-control mt-2"
              id="inputBuscador"
            />
          </div>
          <div class="mt-4">
            <button class="btn btn-primary" id="botonBuscarEmpleado">
              Buscar
            </button>
            <button class="btn btn-warning" id="botonEliminarEmpleado">
              Eliminar
            </button>
          </div>
        </div>
        <div class="col ps-lg-5">
          <h2>Lista de Empleados</h2>
          <ul class="list-group" id="listaEmpleados"></ul>
        </div>
      </div>
    </main>

    <script src="examen.js"></script>
  </body>
</html>
