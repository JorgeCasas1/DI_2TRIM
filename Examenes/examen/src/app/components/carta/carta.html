<div class="col">
  <div class="card">
    <div class="card-body">
      <img [src]="item!!.paginas | imagenes" class="card-img-top" alt="..." />
      <h5 class="card-title">{{ item!!.titulo }}</h5>
      <p class="card-text"></p>
      <p>{{ item!!.ano }}</p>

      <div class="form-control mb-3">
        <button type="submit" class="btn btn-primary">Agregar al carrito</button>
      </div>

      <div class="form-control mb-3">
        <button
          type="submit"
          class="btn btn-primary"
          [routerLink]="['/detalle', item!!.id]"
          ,item!!.id
        >
          Ver detalle
        </button>
      </div>
    </div>
  </div>
</div>
