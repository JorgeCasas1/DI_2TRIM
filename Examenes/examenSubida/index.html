<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title></title>
  </head>
  <body>
    <main class="container mt-4">
      <div class="row">
        <div class="col">
          <h2>CARRITO</h2>
          <div class="mt-4">
            <ul class="list-group" id="listaProductos"></ul>
          </div>

          <div class="mt-4">
            <button class="btn btn-primary" id="botonVerTotal">
              Ver total carrito
            </button>
          </div>

          <div class="mt-4">
            <h2>Total Compra</h2>
            <input
            placeholder=""
              type="text"
              class="form-control mt-2"
              id="totalCompra"
            />
          </div>
        </div>

        <div class="col ps-lg-5">
          <h2>Productos</h2>
          <input
              placeholder="Introduce el nombre"
              type="text"
              class="form-control mt-2"
              id="inputNombre"
            />
          <div class="mt-4">
            
            <input
            min="0"
              placeholder="Introduce el precio"
              type="number"
              class="form-control mt-2"
              id="inputPrecio"
            />
            
          </div>
          <div class="mt-4">
          

          <select class="mt-4" id="select-categoria">
            <option selected value="Todas las categorías">
              Todas las categorías
            </option>
            <option value="1">Informática</option>

            <option value="2">Electrónica</option>

            <option value="3">Juegos</option>

            <option value="4">Limpieza</option>
          </select>
        </div>
        
          <div class="mt-4">
            <button class="btn btn-primary" id="botonAñadir">
              Añadir al carrito
            </button>
          </div>
      </div>
    </main>

    <script src="examen.js"></script>
  </body>
</html>
